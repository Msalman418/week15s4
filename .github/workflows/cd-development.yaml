name: workflows cd-development

on:
  push:
    branches:
      - develop

jobs:
  cd-build-development-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: create build artifacts
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"

      - name: upload development artifacts
        uses: actions/upload-pages-artifacts@v3
        with:
          path: "./dist"
          name: "development-artifacts"

  cd-deploy-development-job:
    needs: cd-build-development-job
    environment: development-env
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: deploy artifacts
        uses: actions/deploy-pages@v4
        with:
          artifact-name: "development-artifacts"
          token: ${{ github.token }}
